name: Release verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/studio exec playwright install --with-deps chromium
      - name: Record verified source
        run: git rev-parse HEAD
      - run: pnpm verify:release
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-release-evidence
          path: |
            artifacts/studio/playwright-report/
            artifacts/studio/test-results/
            artifacts/studio/test-results-production/
          if-no-files-found: ignore
          retention-days: 7
